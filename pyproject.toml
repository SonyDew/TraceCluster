[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecluster"
version = "0.1.0"
description = "Group repeated Python tracebacks in text logs"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
tracecluster = "tracecluster.__main__:main"

[tool.setuptools.packages.find]
include = ["tracecluster*"]
